<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <title>Lecto — your reading nook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section id="library-screen" class="screen" aria-labelledby="app-title">
      <header class="library-header">
        <div>
          <h1 id="app-title">
            <svg viewBox="0 0 150 150" role="img" aria-label="Lecto" xmlns="http://www.w3.org/2000/svg">
              <path d="M28.6146 23C23.368 23.0001 18.8333 26.6483 17.7286 31.7572L0.253906 112.573C-1.2397 119.481 4.04544 126 11.1399 126H138.854C146.608 126 151.989 118.303 149.299 111.059L143.185 94.5971C141.397 89.782 136.525 86.8193 131.408 87.4338L80.7824 93.5154L134.774 42.1113C142.034 35.1993 137.122 23.0001 127.079 23H28.6146Z" fill="currentColor"/>
            </svg>
          </h1>
        </div>
        <button id="settings-button" class="icon-button" type="button" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="5" r="1.5"/>
            <circle cx="12" cy="12" r="1.5"/>
            <circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
      </header>

      <div class="library-intro">
        <div>
          <p class="section-kicker">YOUR PERSONAL LIBRARY</p>
          <h2>Pick up where you left off.</h2>
        </div>
        <button id="import-button" class="primary-button" type="button">
          <span class="plus-icon" aria-hidden="true">+</span>
          <span>Import a book</span>
        </button>
        <input id="file-input" type="file" accept=".txt,.pdf,.epub,.mobi,.azw,.azw3,text/plain,application/pdf,application/epub+zip,application/x-mobipocket-ebook" hidden>
      </div>

      <p id="library-status" class="status-message" role="status" aria-live="polite"></p>
      <div id="library-list" class="book-list" aria-label="Your books"></div>
      <p class="library-footnote">Your books and reading progress stay on this device.</p>
    </section>

    <section id="settings-screen" class="screen" aria-labelledby="settings-title" hidden>
      <header class="subpage-header">
        <button class="text-button back-button" type="button" data-screen="library">← <span>Library</span></button>

      </header>
      <div class="settings-heading">
        <h1 id="settings-title">Preferences</h1>
        <p class="eyebrow">Make yourself comfortable</p>
      </div>
      <form id="settings-form" class="settings-card">
        <label class="setting-control" for="chunk-size">
          <span class="setting-label">
            <span>Words per page</span>
            <output id="chunk-size-output" for="chunk-size">250</output>
          </span>
          <input id="chunk-size" name="chunkSize" type="range" min="50" max="500" step="10" value="250">
          <span class="range-ends"><span>50 words</span><span>500 words</span></span>
        </label>
        <fieldset class="theme-picker">
          <legend>Color scheme</legend>
          <div class="theme-options">
            <label class="theme-option">
              <input type="radio" name="theme" value="Warm" checked>
              <span class="theme-swatch warm-swatch" aria-hidden="true"></span>
              <span>Warm</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="Cool">
              <span class="theme-swatch cool-swatch" aria-hidden="true"></span>
              <span>Cool</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="Night">
              <span class="theme-swatch night-swatch" aria-hidden="true"></span>
              <span>Night</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="Sage">
              <span class="theme-swatch sage-swatch" aria-hidden="true"></span>
              <span>Sage</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="Rose">
              <span class="theme-swatch rose-swatch" aria-hidden="true"></span>
              <span>Rose</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="Lavender">
              <span class="theme-swatch lavender-swatch" aria-hidden="true"></span>
              <span>Lavender</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="Forest">
              <span class="theme-swatch forest-swatch" aria-hidden="true"></span>
              <span>Forest</span>
            </label>
          </div>
        </fieldset>
        <div class="settings-actions">
          <button class="primary-button" type="submit">Apply settings</button>
          <button class="text-button" type="button" data-screen="library">Cancel</button>
        </div>
      </form>
    </section>

    <section id="reader-screen" class="screen reader-screen" aria-labelledby="reader-title" hidden>
      <header class="reader-header">
        <button class="text-button back-button" type="button" data-screen="library">← <span>Library</span></button>
        <div class="reader-progress">
          <label id="chapter-navigation" class="chapter-navigation" hidden>
            <span>Chapter</span>
            <span class="chapter-picker">
              <button id="chapter-picker-toggle" class="chapter-picker-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="chapter-picker-menu">
                <span id="chapter-picker-value">Select chapter</span>
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3"/></svg>
              </button>
              <span id="chapter-picker-menu" class="chapter-picker-menu" role="listbox" aria-label="Chapters" hidden></span>
            </span>
          </label>
          <span id="page-count" class="page-count" aria-live="polite">01 / 01</span>
        </div>
      </header>
      <article id="reader-card" class="reader-card">
        <div class="reader-book-heading">
          <p class="section-kicker">NOW READING</p>
          <h1 id="reader-title"></h1>
          <p id="reader-author" class="reader-author"></p>
          <p id="reader-chapter-title" class="reader-chapter-title" hidden></p>
        </div>
        <div class="reader-divider" aria-hidden="true"><span></span></div>
        <div class="reader-page-viewport">
          <p id="reader-content" class="reader-content" tabindex="0"></p>
        </div>
        <div class="reader-navigation" aria-label="Page navigation">
          <button id="previous-page" class="nav-button" type="button" aria-label="Previous page">← <span>Previous</span></button>
          <span id="reader-hint" class="reader-hint">Swipe up or down to turn the page</span>
          <button id="next-page" class="nav-button" type="button" aria-label="Next page"><span>Next</span> →</button>
        </div>
      </article>
    </section>
  </main>
  <dialog id="delete-book-dialog" class="confirmation-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-message">
    <div class="confirmation-content">
      <p class="eyebrow">YOUR LIBRARY</p>
      <h2 id="delete-dialog-title">Remove this book?</h2>
      <p id="delete-dialog-message" class="confirmation-message"></p>
      <div class="confirmation-actions">
        <button id="cancel-delete" class="text-button" type="button">Keep book</button>
        <button id="confirm-delete" class="danger-button" type="button">Delete book</button>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
